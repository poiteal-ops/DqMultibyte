[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mbscan"
version = "0.1.0"
description = "Scan Oracle tables/views/materialized views for multibyte and mojibake character corruption, and generate a reviewable (never auto-run) fix script."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "oracledb>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mbscan = "mbscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
